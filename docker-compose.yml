
version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: enterprise
    ports: ["5432:5432"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  backend:
    build: backend
    ports: ["8080:8080"]
    depends_on: [postgres, redis]

  frontend:
    build: frontend
    ports: ["4200:80"]
    depends_on: [backend]
